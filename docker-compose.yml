name: mini-orderstream

services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9094:9094"            # host:container, only the EXTERNAL listener is published
    environment:
      # --- KRaft: this single process is both broker and controller ---
      CLUSTER_ID: uM1U5n36THSYtyNwKPOCig
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners: where Kafka listens, and what address it tells clients ---
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single broker: internal topics cannot have more than 1 copy ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # --- Behaviour ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - orders.events
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    restart: "no"

  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5433:5432"            # 5433 on your machine, in case a local Postgres already uses 5432
    environment:
      POSTGRES_USER: orderstream
      POSTGRES_PASSWORD: orderstream
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderstream"]
      interval: 5s
      timeout: 5s
      retries: 10
